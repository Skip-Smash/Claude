<title>Ons Nieuwe Huis</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: sticky kop met tab-strip; kaarten alleen waar iets een los object is. Labels als stukjes schilderstape. */
:root{
  --paper:#EEF1EE; --card:#FFFFFF; --ink:#1C2423; --muted:#5B6866; --line:#D3DAD6; --soft:#E3E8E5;
  --tape:#2D5BD0; --tape-ink:#FFFFFF; --tape-soft:#DCE4F8;
  --ok:#2E7D4F; --ok-soft:#DCEFE3; --warn:#A86A12; --warn-soft:#F6EAD3; --bad:#B23A2E;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Instrument Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#111615; --card:#192120; --ink:#E4EBE8; --muted:#93A29F; --line:#2B3634; --soft:#212A29;
  --tape:#7B9BF0; --tape-ink:#0D1424; --tape-soft:#1E2945;
  --ok:#6CC08F; --ok-soft:#173326; --warn:#E0A94D; --warn-soft:#3A2C14; --bad:#EF7B6E; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#111615; --card:#192120; --ink:#E4EBE8; --muted:#93A29F; --line:#2B3634; --soft:#212A29;
  --tape:#7B9BF0; --tape-ink:#0D1424; --tape-soft:#1E2945;
  --ok:#6CC08F; --ok-soft:#173326; --warn:#E0A94D; --warn-soft:#3A2C14; --bad:#EF7B6E; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--paper);color:var(--ink)}
body{font-family:var(--f-body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
h1{font-size:clamp(26px,5vw,38px);font-weight:800;letter-spacing:-.02em}
h2{font-size:21px;font-weight:700}
h3{font-size:16px;font-weight:700}
p{margin:0}
a{color:var(--tape)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--tape);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--line)}
.topbar{display:flex;align-items:center;gap:12px;padding-block:12px 6px}
.brand{font-family:var(--f-display);font-weight:800;font-size:19px;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.brand .key{width:26px;height:26px;border-radius:7px;background:var(--tape);display:grid;place-items:center;color:var(--tape-ink)}
.count{margin-left:auto;font-size:13px;color:var(--muted);white-space:nowrap}
.count b{color:var(--ink);font-family:var(--f-mono)}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;padding-block:2px 0}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs a{flex:none;text-decoration:none;color:var(--muted);padding:8px 12px 10px;font-weight:600;font-size:14px;border-bottom:3px solid transparent}
nav.tabs a.on{color:var(--ink);border-bottom-color:var(--tape)}
main{padding-block:22px 80px}
.stack{display:flex;flex-direction:column;gap:18px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.g3{grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:7px 12px;cursor:pointer;font-weight:600;font-size:14px;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--tape)}
.btn.primary{background:var(--tape);border-color:var(--tape);color:var(--tape-ink)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:4px 9px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
/* tape label */
.tape{display:inline-block;background:var(--tape-soft);color:var(--ink);font-size:12px;font-weight:600;padding:2px 8px;border-radius:2px;letter-spacing:.02em;clip-path:polygon(0 8%,3% 0,97% 6%,100% 0,99% 92%,96% 100%,4% 94%,0 100%)}
.tape.solid{background:var(--tape);color:var(--tape-ink)}
.tape.ok{background:var(--ok-soft);color:var(--ok)}
.tape.warn{background:var(--warn-soft);color:var(--warn)}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.dot{width:14px;height:14px;border-radius:50%;border:1px solid rgba(0,0,0,.15);flex:none;display:inline-block}
.bar{height:8px;border-radius:4px;background:var(--soft);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--tape)}
.bar.ok>i{background:var(--ok)}
.empty{border:1.5px dashed var(--line);border-radius:var(--r);padding:22px;text-align:center;color:var(--muted)}
input[type=text],input[type=number],input[type=date],input[type=url],select,textarea{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
textarea{min-height:80px;resize:vertical}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:var(--muted)}
/* hero */
.hero{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.daybox{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.daybox .big{font-family:var(--f-display);font-weight:800;font-size:44px;line-height:1;letter-spacing:-.03em}
/* tasks */
.task{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line)}
.task:first-child{border-top:0}
.task input[type=checkbox]{width:20px;height:20px;margin-top:2px;accent-color:var(--ok);flex:none}
.task .t{flex:1;min-width:0;cursor:pointer}
.task.done .tt{text-decoration:line-through;color:var(--muted)}
.task .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px;font-size:12px;color:var(--muted)}
.phase{display:flex;flex-direction:column;gap:6px}
.addline{display:flex;gap:8px;margin-top:6px}
/* rooms */
.room{padding:0;overflow:hidden;cursor:pointer;display:flex;flex-direction:column}
.room .ph{aspect-ratio:2/1;background:var(--soft);background-size:125% auto;background-position:center 18%;position:relative}
.room .ph .tape{position:absolute;left:10px;top:10px}
.room .b{padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.swatches{display:flex;gap:4px;flex-wrap:wrap}
/* plan */
.planbox{position:relative;background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;touch-action:manipulation}
.planbox img{display:block;width:100%;height:auto;user-select:none;-webkit-user-drag:none}
.pin{position:absolute;transform:translate(-50%,-50%);cursor:pointer;white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,.18);font-size:13px;padding:4px 10px}
.planbox.placing{cursor:crosshair;outline:3px solid var(--tape);outline-offset:-3px}
/* mood */
.mood{columns:3 220px;column-gap:12px}
.mood>*{break-inside:avoid;margin-bottom:12px}
.mi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;position:relative}
.mi img{display:block;width:100%;cursor:zoom-in}
.mi .cap{padding:8px 10px;font-size:13px}
.mi .x{position:absolute;right:6px;top:6px;opacity:0;transition:opacity .15s}
.mi:hover .x,.mi:focus-within .x{opacity:1}
@media (hover:none){.mi .x{opacity:1}}
.swatchcard .chip{height:90px}
/* table */
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-size:12px;color:var(--muted);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line)}
.tbl td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl td.r,.tbl th.r{text-align:right}
.scroll{overflow-x:auto}
/* tips */
.tip{display:flex;flex-direction:column;gap:8px}
.tip .act{margin-top:auto}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--card);padding:5px 11px;border-radius:999px;font-size:13px;font-weight:600;cursor:pointer}
.chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
/* chat */
.chat{display:flex;flex-direction:column;gap:10px;max-height:520px;overflow-y:auto;padding-right:4px}
.msg{padding:10px 12px;border-radius:10px;max-width:92%;white-space:pre-wrap;font-size:14px}
.msg.u{align-self:flex-end;background:var(--tape);color:var(--tape-ink)}
.msg.a{align-self:flex-start;background:var(--soft)}
/* modal */
.modal{position:fixed;inset:0;z-index:50;background:rgba(10,14,13,.55);display:grid;place-items:center;padding:16px}
.sheet{background:var(--card);color:var(--ink);border-radius:14px;width:min(560px,100%);max-height:88vh;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:12px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fgrid .full{grid-column:1/-1}
@media (max-width:480px){.fgrid{grid-template-columns:1fr}}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:10px;z-index:80;font-size:14px;max-width:calc(100% - 32px)}
/* viewer (altijd donker) */
#viewer{position:fixed;inset:0;z-index:40;background:#0B0E0E;color:#E8EEEC;display:flex;flex-direction:column}
#viewer .vt{display:flex;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 10px max(12px,env(safe-area-inset-left,0px));background:#0B0E0E}
#viewer .vt h3{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#viewer .stage{flex:1;position:relative;min-height:0;touch-action:none;cursor:grab}
#viewer .stage canvas{display:block;width:100%;height:100%}
#viewer .stage.draw{cursor:crosshair}
#viewer .hint{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:rgba(0,0,0,.7);padding:8px 12px;border-radius:8px;font-size:13px;max-width:calc(100% - 24px);text-align:center}
#viewer .vs{background:#141A19;padding:12px max(12px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:10px;max-height:46vh;overflow-y:auto;border-top:1px solid #26302E}
#viewer .btn{background:#1E2625;border-color:#2F3A38;color:#E8EEEC}
#viewer .btn.primary{background:#7B9BF0;border-color:#7B9BF0;color:#0D1424}
#viewer select{background:#1E2625;border-color:#2F3A38;color:#E8EEEC;width:auto}
#viewer .wchip{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;border:1px solid #2F3A38;background:#1E2625;cursor:pointer;font-size:13px;font-weight:600}
#viewer .wchip.on{border-color:#7B9BF0;box-shadow:0 0 0 2px #7B9BF0 inset}
#viewer .pal{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
#viewer .pal button{flex:none;width:54px;border:0;background:none;padding:0;cursor:pointer;color:#C9D3D0;font-size:10px;text-align:center}
#viewer .pal .sw{display:block;width:54px;height:40px;border-radius:6px;border:2px solid #2F3A38;margin-bottom:3px}
#viewer .pal button.on .sw{border-color:#fff;box-shadow:0 0 0 2px #7B9BF0}
#viewer .muted{color:#94A39F}
.rgal{display:flex;gap:6px;overflow-x:auto;padding:2px 0}
.rthumb{flex:none;width:120px;height:60px;border-radius:6px;border:1px solid var(--line);background-size:cover;background-position:center 30%;position:relative;cursor:pointer;padding:0}
.rthumb span{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.55);color:#fff;font-size:11px;padding:2px 5px;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-radius:0 0 6px 6px}
#viewer .rchip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px 4px 4px;border-radius:999px;border:1px solid #2F3A38;background:#1E2625;cursor:pointer;font-size:13px;font-weight:600;color:#E8EEEC}
#viewer .rchip img{width:44px;height:22px;object-fit:cover;border-radius:999px}
#viewer .rchip.on{border-color:#7B9BF0;box-shadow:0 0 0 2px #7B9BF0 inset}
#viewer .spin{position:absolute;inset:0;display:grid;place-items:center;font-size:14px;color:#94A39F}
#viewer .split{position:absolute;top:0;bottom:0;width:0;pointer-events:none}
#viewer .split::before{content:"";position:absolute;top:0;bottom:0;left:-1px;width:2px;background:#fff;box-shadow:0 0 6px rgba(0,0,0,.5)}
#viewer .split .knob{position:absolute;top:50%;left:-22px;width:44px;height:44px;margin-top:-22px;border-radius:50%;border:2px solid #fff;background:rgba(12,16,15,.8);color:#fff;font-size:18px;cursor:ew-resize;pointer-events:auto;touch-action:none}
#viewer .split .tg{position:absolute;top:12px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:rgba(12,16,15,.75);padding:3px 8px;border-radius:4px;white-space:nowrap}
#viewer .split .tg.l{right:10px}#viewer .split .tg.r{left:10px}
#viewer .seg{display:inline-flex;border:1px solid #2F3A38;border-radius:8px;overflow:hidden}
#viewer .seg button{background:#1E2625;border:0;color:#C9D3D0;padding:6px 12px;font-weight:600;font-size:13px;cursor:pointer}
#viewer .seg button.on{background:#7B9BF0;color:#0D1424}
#viewer .wallhead{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
#viewer .bigsw{width:56px;height:56px;border-radius:10px;border:2px solid #2F3A38;flex:none}
#viewer .wn{font-family:var(--f-display);font-weight:700;font-size:18px;line-height:1.2}
#viewer .tabs2{display:flex;gap:2px;border-bottom:1px solid #26302E}
#viewer .tabs2 button{background:none;border:0;border-bottom:2px solid transparent;color:#94A39F;padding:6px 10px;font-weight:600;font-size:13px;cursor:pointer}
#viewer .tabs2 button.on{color:#E8EEEC;border-bottom-color:#7B9BF0}
#viewer .palgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(58px,1fr));gap:6px}
#viewer .swb{background:none;border:0;padding:0;cursor:pointer;color:#C9D3D0;font-size:11px;text-align:center;min-width:0}
#viewer .swb .sw{display:block;height:36px;border-radius:8px;border:2px solid #2F3A38;margin-bottom:3px;transition:transform .12s}
#viewer .swb:hover .sw{transform:translateY(-2px)}
#viewer .swb.on .sw{border-color:#fff;box-shadow:0 0 0 2px #7B9BF0}
#viewer .swb .nm{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#viewer details.more summary{cursor:pointer;color:#94A39F;font-size:13px}
#viewer .btn.primary[aria-pressed="true"]{background:#7B9BF0}
.lb{position:fixed;inset:0;z-index:45;background:rgba(5,8,8,.9);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px;color:#E8EEEC}
.lb canvas{max-width:100%;max-height:72vh;cursor:crosshair;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<script>
"use strict";
/* ---------- constanten ---------- */
const KEY_DATE_DEFAULT="2027-01-07", MOVE_DATE_DEFAULT="2027-01-09";
const PHASES=[
  {id:"voor",name:"Voorbereiden",sub:"nu t/m 6 januari"},
  {id:"sleutel",name:"Sleutel & klussen",sub:"7–8 januari"},
  {id:"verhuis",name:"Verhuisdag",sub:"9 januari"},
  {id:"na",name:"Eerste weken",sub:"als we er wonen"},
  {id:"later",name:"Later",sub:"lente & zomer"}
];
const ITEM_CATS=["Verf & klussen","Meubels","Verlichting","Raamdecoratie","Smarthome","Tuin","Verhuizing","Overig"];
const ITEM_STATUS=[["idee","Idee"],["kiezen","Nog kiezen"],["bestellen","Te bestellen"],["besteld","Besteld"],["binnen","Binnen"]];
const SH_KINDS=["Hardware","Software","Automatisering","Idee"];
const SH_STATUS=[["idee","Idee"],["gekozen","Gekozen"],["besteld","Besteld"],["klaar","Geïnstalleerd"]];
const ROOM_COLORS=["#2D5BD0","#2E7D4F","#C0533A","#8E44AD","#D4A017","#16808C","#B5487C","#5D6D7E","#7A5C3E","#E07B39"];

/* ---------- tips ---------- */
const TIPS=[
 {id:"reg-brp",cat:"Regelen",t:"Verhuizing doorgeven aan de gemeente",b:"Kan vanaf 4 weken vóór tot uiterlijk 5 dagen na de verhuisdatum, met DigiD via de site van je nieuwe gemeente. Belastingdienst, RDW en de meeste zorgverzekeraars krijgen het dan automatisch door.",task:{phase:"voor",date:"2026-12-12"}},
 {id:"reg-internet",cat:"Regelen",t:"Internet nú aanvragen",b:"Een monteur-afspraak kan 2–3 weken duren. Check welke aansluiting er op het adres ligt (glasvezel of kabel). Je smarthome hangt ervan af, dus liefst werkend op de sleuteldag.",task:{phase:"voor",date:"2026-11-25"}},
 {id:"reg-energie",cat:"Regelen",t:"Energie en water aanmelden per 7 januari",b:"Meld stroom/gas aan op het nieuwe adres vanaf de sleuteldatum en zeg het oude adres op per de opleverdatum. Water gaat meestal automatisch per adres, maar check het bij het waterbedrijf.",task:{phase:"voor",date:"2026-12-01"}},
 {id:"reg-oud",cat:"Regelen",t:"Huidige woning opzeggen of oplevering afspreken",b:"Huren jullie nu? De opzegtermijn is meestal één maand. Plan een voorinspectie, dan weet je wat er bij oplevering nog moet gebeuren.",task:{phase:"voor",date:"2026-11-30"}},
 {id:"reg-post",cat:"Regelen",t:"Post laten doorsturen",b:"Via de Verhuisservice van PostNL wordt post naar het oude adres een tijd doorgestuurd. Handig voor alles wat je vergeet te wijzigen.",task:{phase:"voor",date:"2027-01-02"}},
 {id:"reg-verzekering",cat:"Regelen",t:"Inboedelverzekering verhuizen",b:"Wijzig het adres per de verhuisdatum en vraag of schade tijdens zelf verhuizen gedekt is. De opstalverzekering moet vanaf de overdracht lopen (meestal al geregeld via de hypotheek, check het).",task:{phase:"voor"}},
 {id:"reg-adres",cat:"Regelen",t:"Adreswijziging bij de rest",b:"Bank, werkgever, abonnementen, webshops, huisarts/tandarts, sportschool, goede doelen en klantenkaarten. Die krijgen het niet via de gemeente.",task:{phase:"na"}},

/* ---------- helpers ---------- */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const eur=n=>"€ "+(Number(n)||0).toLocaleString("nl-NL",{minimumFractionDigits:0,maximumFractionDigits:2});
const num=v=>{const n=parseFloat(String(v??"").replace(",","."));return isFinite(n)?n:0};
const dfmt=d=>{if(!d)return"";const x=new Date(d+"T12:00:00");return x.toLocaleDateString("nl-NL",{day:"numeric",month:"short"})};
const daysTo=d=>Math.ceil((new Date(d+"T00:00:00")-new Date(new Date().toDateString()))/864e5);
const rid=()=>Math.random().toString(36).slice(2,10);
const assetUrl=id=>id?"/_blob/"+id:"";
function toast(msg,ms=2600){const t=document.createElement("div");t.className="toast";t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),ms)}
const lsGet=(k,d)=>{try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
function hexToRgb(h){h=String(h||"").replace("#","");if(h.length===3)h=h.split("").map(c=>c+c).join("");const n=parseInt(h,16);if(isNaN(n)||h.length!==6)return null;return[n>>16&255,n>>8&255,n&255]}
const rgbToHex=(r,g,b)=>"#"+[r,g,b].map(v=>Math.round(v).toString(16).padStart(2,"0")).join("").toUpperCase();

async function add(col,data){const ref=db.collection(col).doc();await ref.set({...data,createdAt:Date.now()});return ref.id}
async function upd(col,id,data){await db.collection(col).doc(id).update(data)}
async function setDoc(col,id,data){await db.collection(col).doc(id).set(data)}
async function del(col,id){await db.collection(col).doc(id).delete()}
async function safe(fn,msg="Opslaan lukte niet. Probeer het opnieuw."){try{return await fn()}catch(e){console.error(e);toast(e&&e.code==="quota_exceeded"?"De opslag van de app is vol.":msg);return null}}

/* ---------- render met behoud van invoer ---------- */
let renderQueued=false;
function render(){if(renderQueued)return;renderQueued=true;requestAnimationFrame(()=>{renderQueued=false;doRender()})}
function doRender(){
  const app=$("#app");const act=document.activeElement;const keep={};
  app.querySelectorAll("input[id],textarea[id],select[id]").forEach(el=>{if(el.type!=="checkbox")keep[el.id]=el.value});
  const focusId=act&&app.contains(act)?act.id:null;let sel=null;try{if(focusId)sel=[act.selectionStart,act.selectionEnd]}catch(e){}
  const chatScroll=$("#chatlog")?.scrollTop;
  const route=(location.hash||"#overzicht").slice(1);
  document.querySelectorAll("#tabs a").forEach(a=>a.classList.toggle("on",route===a.dataset.r||(route.startsWith("kamer-")&&a.dataset.r==="kamers")));
  renderCount();
  let html="";
  if(!db){html=noDb()}
  else if(route.startsWith("kamer-"))html=viewRoom(route.slice(6));
  else html=({overzicht:viewHome,plattegrond:viewPlan,kamers:viewRooms,planning:viewPlanning,kosten:viewCosts,smarthome:viewSmart,tips:viewTips}[route]||viewHome)();
  app.innerHTML=html;
  for(const id in keep){const el=document.getElementById(id);if(el&&el.type!=="file")el.value=keep[id]}
  if(focusId){const el=document.getElementById(focusId);if(el){el.focus();try{if(sel)el.setSelectionRange(sel[0],sel[1])}catch(e){}}}
  const cl=$("#chatlog");if(cl)cl.scrollTop=chatScroll??cl.scrollHeight;
  if(route==="plattegrond")bindPlan();
}
function noDb(){return `<div class="card stack"><h2>Opslag niet beschikbaar</h2><p class="muted">Deze app bewaart alles in een gedeelde opslag. Die is in deze weergave niet bereikbaar. Open de app ingelogd op claude.ai, of vraag de eigenaar om je toegang als Editor te geven.</p></div>`}
function renderCount(){const s=settings();const k=daysTo(s.keyDate),m=daysTo(s.moveDate);
  $("#countTop").innerHTML=k>0?`sleutel over <b>${k}</b> d · verhuizen over <b>${m}</b> d`:m>0?`verhuizen over <b>${m}</b> d`:`we wonen er!`}

    <div class="daybox"><div class="eyebrow">Verhuisdag · ${esc(dfmt(s.moveDate))}</div><div class="big num">${m>0?m:"✓"}</div><div class="muted small">${m>0?"dagen tot de verhuizing":"verhuisd"}</div></div>

  </div>
  <div class="grid g2">
    <section class="card"><div class="row between"><h2>Eerstvolgende taken</h2><a class="btn sm" href="#planning">Planning</a></div>
      <div style="margin-top:8px">${nxt.length?nxt.map(taskRow).join(""):`<div class="empty">Nog geen open taken. Voeg ze toe in Planning of vanuit Tips.</div>`}</div></section>
    <section class="card stack"><h2>Voortgang per fase</h2>
      ${phaseStats.map(x=>`<div><div class="row between small"><span><b>${esc(x.p.name)}</b> <span class="muted">${esc(x.p.sub)}</span></span><span class="num muted">${x.d}/${x.n}</span></div><div class="bar ok"><i style="width:${x.n?x.d/x.n*100:0}%"></i></div></div>`).join("")}
    </section>
  </div>
  <section class="stack"><div class="row between"><h2>Kamers</h2><a class="btn sm" href="#kamers">Alle kamers</a></div>
    ${S.rooms.length?`<div class="grid g3">${sortRooms().map(roomCard).join("")}</div>`:`<div class="empty">Nog geen kamers. Ga naar <a href="#kamers">Kamers</a> en laad jullie 360°-foto's in. Dan komt er per foto een kamer bij.</div>`}
  </section>
  <section class="card"><div class="row between"><h2>Datums</h2></div>
    <div class="row" style="margin-top:8px"><label class="f">Sleutel<input type="date" id="set-key" value="${esc(s.keyDate)}" data-set="keyDate"></label><label class="f">Verhuisdag<input type="date" id="set-move" value="${esc(s.moveDate)}" data-set="moveDate"></label></div>
  </section></div>`;
}
function taskSort(a,b){const pi=x=>PHASES.findIndex(p=>p.id===(x.phase||"voor"));return pi(a)-pi(b)||String(a.date||"9999").localeCompare(String(b.date||"9999"))||(a.createdAt||0)-(b.createdAt||0)}
function taskRow(t){
  const r=t.roomId?byId("rooms",t.roomId):null;
  return `<div class="task ${t.done?"done":""}"><input type="checkbox" ${t.done?"checked":""} data-toggle="${t.id}" aria-label="Afvinken: ${esc(t.title)}">
  <div class="t" data-edit-task="${t.id}"><div class="tt">${esc(t.title)}</div><div class="meta">${t.date?`<span class="mono">${esc(dfmt(t.date))}</span>`:""}${r?`<span class="tape" style="background:${esc(r.color||"var(--tape-soft)")}22">${esc(r.name)}</span>`:""}${num(t.cost)?`<span class="mono">${eur(t.cost)}</span>`:""}${t.notes?`<span>📝</span>`:""}</div></div></div>`;
}
function roomCard(r){
  const ph=S.photos.filter(p=>p.roomId===r.id);const th=ph.find(p=>p.thumbId);
  const pals=roomPaints(r.id);
  const open=S.tasks.filter(t=>t.roomId===r.id&&!t.done).length;
  return `<a class="card room" href="#kamer-${r.id}" style="text-decoration:none;color:inherit"><div class="ph" style="${th?`background-image:url('${assetUrl(th.thumbId)}')`:""}"><span class="tape" style="background:${esc(r.color||"#2D5BD0")};color:#fff">${esc(r.name||"Kamer")}</span></div>
  <div class="b"><div class="small muted">${esc(r.style||"Nog geen stijl")}</div><div class="row between"><div class="swatches">${pals.map(p=>`<span class="dot" style="background:${esc(p.hex)}" title="${esc(p.name)}"></span>`).join("")}</div><span class="small muted">${ph.length} foto${ph.length===1?"":"'s"} · ${open} open</span></div></div></a>`;
}
function roomPaints(roomId){const ids=new Set();S.photos.filter(p=>p.roomId===roomId).forEach(p=>{const v=(p.variants||[]).find(v=>v.id===p.activeVariant)||(p.variants||[])[0];if(v)Object.values(v.colors||{}).forEach(id=>id&&ids.add(id))});return[...ids].map(id=>byId("paints",id)).filter(Boolean)}

  return `<div class="stack">

  if(m.type==="link"){let host="";try{host=new URL(m.href).hostname.replace("www.","")}catch(e){}
    return `<div class="mi"><div class="cap stack" style="gap:4px"><span class="tape ${/pinterest/.test(host)?"solid":""}">${esc(/pinterest/.test(host)?"Pinterest":host||"Link")}</span><a href="${esc(m.href)}" target="_blank" rel="noopener">${esc(m.caption||m.href)}</a></div>${x}</div>`}

}

/* ---------- Kosten ---------- */
function paintCalc(p){const m2=num(p.m2),layers=num(p.layers)||2,cov=num(p.coverage)||9;const liters=m2*layers/cov;return{liters,cost:liters*num(p.price)}}
function costModel(){
  const cats={};const addc=(c,pl,sp)=>{cats[c]=cats[c]||{pl:0,sp:0};cats[c].pl+=pl;cats[c].sp+=sp};
  S.items.forEach(i=>{const v=num(i.qty||1)*num(i.price);addc(i.cat||"Overig",v,["besteld","binnen"].includes(i.status)?v:0)});
  S.paints.forEach(p=>{const c=paintCalc(p).cost;if(c)addc("Verf & klussen",c,p.bought?c:0)});
  S.sh.forEach(s=>{const v=num(s.qty||1)*num(s.price);addc("Smarthome",v,["besteld","klaar"].includes(s.status)?v:0)});
  S.tasks.forEach(t=>{const v=num(t.cost);if(v)addc("Taken & diensten",v,t.done?v:0)});
  let planned=0,spent=0;Object.values(cats).forEach(c=>{planned+=c.pl;spent+=c.sp});return{cats,planned,spent};
}
function itemTable(items,showRoom=true){
  return `<div class="scroll"><table class="tbl"><tr><th>Item</th>${showRoom?"<th>Kamer</th>":""}<th>Status</th><th class="r">Bedrag</th></tr>${items.map(i=>`<tr><td><a href="#" data-edit-item="${i.id}">${esc(i.title)}</a>${i.link?` <a href="${esc(i.link)}" target="_blank" rel="noopener" class="small">winkel ↗</a>`:""}<div class="small muted">${esc(i.cat||"")}${num(i.qty)>1?` · ${num(i.qty)}×`:""}</div></td>${showRoom?`<td class="small">${esc(roomName(i.roomId))}</td>`:""}<td><select data-item-status="${i.id}" aria-label="Status" style="width:auto;padding:4px 6px;font-size:13px">${ITEM_STATUS.map(([k,l])=>`<option value="${k}" ${i.status===k?"selected":""}>${l}</option>`).join("")}</select></td><td class="r mono">${eur(num(i.qty||1)*num(i.price))}</td></tr>`).join("")}</table></div>`;
}

   <div><button class="btn sm" data-act="newPaint">Kleur toevoegen</button></div></section>
  ${ordered.length?`<section class="card stack"><h2>Besteld & binnen</h2>${itemTable(ordered)}</section>`:""}
  ${ideas.length?`<section class="card stack"><h2>Ideeën (nog niet begroot als keuze)</h2>${itemTable(ideas)}</section>`:""}

function modal(html){const l=$("#layer");const m=document.createElement("div");m.className="modal";m.innerHTML=`<div class="sheet" role="dialog" aria-modal="true">${html}</div>`;l.appendChild(m);m.addEventListener("click",e=>{if(e.target===m)m.remove()});return m}
function form(title,fields,init={},extraBtn){
  return new Promise(res=>{
    const f=fields.map(x=>{const v=init[x.k]??x.def??"";const id="f-"+x.k;let inp;
      if(x.type==="select")inp=`<select id="${id}">${x.options.map(o=>{const[val,lab]=Array.isArray(o)?o:[o,o];return `<option value="${esc(val)}" ${String(v)===String(val)?"selected":""}>${esc(lab)}</option>`}).join("")}</select>`;
      else if(x.type==="textarea")inp=`<textarea id="${id}">${esc(v)}</textarea>`;
      else if(x.type==="color")inp=`<span class="row" style="flex-wrap:nowrap"><input type="color" id="${id}-c" value="${esc(hexToRgb(v)?v:"#cccccc")}" style="width:48px;height:38px;padding:0;border:1px solid var(--line);border-radius:8px;background:none"><input type="text" id="${id}" value="${esc(v)}" class="mono" placeholder="#RRGGBB"></span>`;
      else inp=`<input type="${x.type||"text"}" id="${id}" value="${esc(v)}" ${x.ph?`placeholder="${esc(x.ph)}"`:""} ${x.type==="number"?'step="any" inputmode="decimal"':""}>`;

async function loadBitmap(file,w,h){
  try{return await createImageBitmap(file,{resizeWidth:w,resizeHeight:h,resizeQuality:"high"})}catch(e){}
  const url=URL.createObjectURL(file);try{const img=new Image();img.src=url;await img.decode();return img}finally{setTimeout(()=>URL.revokeObjectURL(url),1000)}
}
async function natSize(file){try{const b=await createImageBitmap(file);const s=[b.width,b.height];b.close&&b.close();return s}catch(e){const url=URL.createObjectURL(file);const img=new Image();img.src=url;await img.decode();URL.revokeObjectURL(url);return[img.naturalWidth,img.naturalHeight]}}
async function toJpeg(src,w,h,q=.88){const c=document.createElement("canvas");c.width=w;c.height=h;c.getContext("2d").drawImage(src,0,0,w,h);return await new Promise(r=>c.toBlob(r,"image/jpeg",q))}
async function processPano(file){
  const [nw,nh]=await natSize(file);
  if(Math.abs(nw/nh-2)>.08)toast(`Let op: ${file.name} is geen 2:1-panorama (${nw}×${nh}). Hij wordt toch ingeladen.`,4000);
  const W=Math.min(8192,nw-nw%2),H=W/2;
  const bmp=await loadBitmap(file,W,H);
  let full=await toJpeg(bmp,W,H,.9);if(full.size>19e6)full=await toJpeg(bmp,W,H,.8);const thumb=await toJpeg(bmp,1024,512,.82);bmp.close&&bmp.close();
  const a=await assets.upload(full),t=await assets.upload(thumb);
  return{assetId:a.id,thumbId:t.id,w:W,h:H};
}
async function addRender(photoId,file){
  const ph=byId("photos",photoId);if(!ph)return;
  let nw,nh;try{[nw,nh]=await natSize(file)}catch(e){toast("Dit bestand kan ik niet lezen.");return}
  if(Math.abs(nw/nh-2)>.04){toast(`Dit beeld is ${nw}×${nh} en geen 2:1-panorama. Vraag ChatGPT om exact dezelfde verhouding (2:1) als het origineel.`,6000);return}
  const v=await form("AI-render toevoegen",[{k:"name",label:"Naam",full:true,ph:"bijv. Warm taupe"},{k:"hex",label:"Kleur (ongeveer)",type:"color",def:"#9B7B6A"},{k:"notes",label:"Notitie of gebruikte opdracht",type:"textarea",full:true}],{name:file.name.replace(/\.[^.]+$/,"")});
  if(!v)return;
  await withBusy("AI-render uploaden…",async()=>{const r=await processPano(file);const item={id:rid(),name:v.name||"AI-render",hex:hexToRgb(v.hex)?rgbToHex(...hexToRgb(v.hex)):"",notes:v.notes||"",assetId:r.assetId,thumbId:r.thumbId,w:r.w,h:r.h,createdAt:Date.now()};
    const cur=byId("photos",photoId);await upd("photos",photoId,{renders:[...(cur.renders||[]),item]});toast("AI-render toegevoegd");
    if(V&&V.id===photoId)showRender(item.id)});
}
async function uploadPano(file,roomId){const r=await processPano(file);const name=file.name.replace(/\.[^.]+$/,"");
  return await add("photos",{roomId,name,...r,walls:[],variants:[{id:"v1",name:"Variant A",colors:{}}],activeVariant:"v1",nadir:0});

async function uploadImage(file,maxW=1800){const [nw,nh]=await natSize(file);const s=Math.min(1,maxW/nw);const w=Math.round(nw*s),h=Math.round(nh*s);const bmp=await loadBitmap(file,w,h);const b=await toJpeg(bmp,w,h,.86);bmp.close&&bmp.close();return await assets.upload(b)}

    ${tab==="eigen"?`<div class="palgrid">${sw_("repeating-linear-gradient(45deg,#2a3331 0 6px,#1b2221 6px 12px)","Origineel",'data-paint=""',!curPaint&&!V.preview)}${pals.map(pa=>sw_(pa.hex,pa.name||pa.hex,`data-paint="${pa.id}"`,curPaint===pa.id&&!V.preview)).join("")}</div>
      ${pals.length?"":`<p class="small muted">Nog geen eigen kleuren. Kies er een bij Inspiratie of Eigen kleur, en sla hem op met merk en kleurcode.</p>`}`:""}

    ${tab==="vrij"?`<div class="row"><input type="color" id="vcol" value="${esc(V.preview||cp?.hex||"#B7BFA6")}" style="width:64px;height:44px;padding:0;border:1px solid #2F3A38;border-radius:8px;background:none"><input type="text" id="vhex" class="mono" value="${esc(V.preview||cp?.hex||"")}" placeholder="#RRGGBB" style="max-width:140px;background:#1E2625;border-color:#2F3A38;color:#E8EEEC"><span class="small muted">Je ziet de kleur meteen op de muur.</span></div>`:""}`;
  }else if(sw&&sw.exclude){
    panel=`<div class="row between"><span class="small">Uitsparing <b>${esc(sw.name)}</b> wordt nooit geverfd.</span><button class="btn sm danger" id="wdel">Verwijderen</button></div>`;
  }else if(walls.some(w=>!w.exclude)){
    panel=`<p class="small muted">Tik op een muur in de foto, of op een naam hierboven, om een kleur te kiezen.</p>`;
  }else{
    panel=`<p class="small muted">Nog geen muren. Tik op <b>+ Muur</b> en daarna op de 4 hoeken van een muur. De app haalt zelf schilderijen, planten en meubels eruit.</p>`;
  }
  sh.innerHTML=rbar+`<div class="row" style="gap:6px">${walls.filter(w=>w.id!=="logo").map(w=>{const pa=byId("paints",(v.colors||{})[w.id]);return `<span class="wchip ${w.id===V.sel?"on":""}" data-w="${w.id}">${w.exclude?"⊘":`<span class="dot" style="background:${pa?esc(pa.hex):"transparent"};border-color:#5b6866"></span>`} ${esc(w.name)}</span>`}).join("")}
    <button class="btn sm primary" id="vadd">+ Muur</button></div>
  ${panel}
  <details class="more" ${lsGet("moreOpen",false)?"open":""}><summary>Meer: hoeken tekenen, uitsparingen, doorgangen, instellingen</summary>
   <div class="stack" style="gap:10px;margin-top:10px">
   <div class="row" style="gap:6px"><button class="btn sm" id="vsel" title="Werkt goed bij gekleurde muren">Snel: tik op een gekleurde muur</button><button class="btn sm" id="vexcl" title="Raam, deur of radiator uitsluiten">+ Uitsparing</button></div>
   <div class="row small" style="gap:6px"><span class="muted">Doorgangen:</span>${links.map(l=>`<span class="wchip"><span data-go="${l.id}">→ ${esc(linkLabel(l))}</span><span data-ldel="${l.id}" title="Verwijderen" style="opacity:.6;padding-left:4px">✕</span></span>`).join("")||`<span class="muted">nog geen</span>`}<button class="btn sm" id="vlink">+ Doorgang</button><button class="btn sm" id="vstart" title="Zo kijk je als je deze foto opent">Startbeeld opslaan</button></div>
   <div class="row between small"><label class="row" style="gap:6px"><input type="checkbox" id="vsmart" ${V.smart?"checked":""}> Slim maskeren <span class="muted">(stopcontacten en lijsten behouden)</span></label>
    <label class="row" style="gap:6px"><input type="checkbox" id="vlines" ${lsGet("showLines",false)?"checked":""}> Lijnen tonen</label></div>
   <div class="row small"><label class="row" style="gap:6px"><input type="checkbox" id="vnadir" ${p.nadir?"checked":""}> Onderkant opvullen <span class="muted">(logo of statief weg)</span></label>
    ${p.nadir?`<input type="range" id="vnadirr" min="0.70" max="0.97" step="0.002" value="${p.nadir}" style="flex:1;min-width:140px" aria-label="Vanaf hoe ver opvullen">`:""}</div>
   </div></details>`;
  $(".more",sh).ontoggle=e=>lsSet("moreOpen",e.target.open);bindRbar();
  sh.querySelectorAll("[data-w]").forEach(b=>b.onclick=()=>selectWall(b.dataset.w));
  $("#vsel",sh).onclick=()=>{V.mode="select";V.seeds=[];V.selMask=null;V.erase=false;V.sel=null;V.preview=null;refreshCompose();drawOverlay();renderSheet()};
  $("#vlink",sh).onclick=()=>{V.mode="link";V.linkDraft=null;V.sel=null;drawOverlay();renderSheet()};
  $("#vstart",sh).onclick=async()=>{await safe(()=>upd("photos",p.id,{startLon:+(((V.lon%360)+360)%360).toFixed(1),startLat:+V.lat.toFixed(1)}));toast("Startbeeld opgeslagen")};
  sh.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{const l=links.find(x=>x.id===b.dataset.go);if(l)goThrough(l)});
  sh.querySelectorAll("[data-ldel]").forEach(b=>b.onclick=async()=>{if(!await confirmBox("Deze doorgang verwijderen?"))return;await safe(()=>upd("photos",p.id,{links:links.filter(x=>x.id!==b.dataset.ldel)}))});
  $("#vadd",sh).onclick=()=>{V.mode="draw";V.draftExclude=false;V.draft=[];V.sel=null;drawOverlay();renderSheet()};
  $("#vexcl",sh).onclick=()=>{V.mode="draw";V.draftExclude=true;V.draft=[];V.sel=null;drawOverlay();renderSheet()};
  $("#vsmart",sh).onchange=e=>{V.smart=e.target.checked;lsSet("smart",V.smart);refreshCompose()};
  $("#vlines",sh).onchange=e=>{lsSet("showLines",e.target.checked);drawOverlay()};
  $("#vnadir",sh).onchange=e=>safe(()=>upd("photos",p.id,{nadir:e.target.checked?(guessNadir(V.pano)||0.84):0}));
  const nr=$("#vnadirr",sh);if(nr){nr.oninput=()=>{V.pano.setNadir(+nr.value);refreshCompose()};nr.onchange=()=>safe(()=>upd("photos",p.id,{nadir:+nr.value}))}
  if(!sw)return;
  $("#wdel",sh)&&($("#wdel",sh).onclick=async()=>{if(!await confirmBox(`“${sw.name}” verwijderen?`))return;const vs=(p.variants||[]).map(x=>{const c={...(x.colors||{})};delete c[sw.id];return{...x,colors:c}});V.sel=null;await safe(()=>upd("photos",p.id,{walls:walls.filter(w=>w.id!==sw.id),variants:vs}))});
  const ren=$("#wren",sh);if(ren)ren.onclick=async()=>{const r=await form("Muur",[{k:"name",label:"Naam",full:true},{k:"m2",label:"Oppervlakte (m²)",type:"number"}],sw);if(r)await safe(()=>upd("photos",p.id,{walls:walls.map(w=>w.id===sw.id?{...w,...r}:w)}))};
  const pe=$("#wpe",sh);if(pe)pe.onclick=()=>editPaint(curPaint);
  const wr=$("#wref",sh);if(wr)wr.onclick=()=>startRefine({...sw},false);
  sh.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{V.tab=b.dataset.tab;lsSet("palTab",V.tab);renderSheet()});
  sh.querySelectorAll("[data-paint]").forEach(b=>b.onclick=()=>assignPaint(p,v,sw.id,b.dataset.paint||null));
  const setPrev=(hex,name)=>{V.preview=hex;V.previewName=name;refreshCompose();renderSheet()};
  sh.querySelectorAll("[data-prev]").forEach(b=>b.onclick=()=>setPrev(b.dataset.prev,b.dataset.pn));
  const vc=$("#vcol",sh),vh=$("#vhex",sh);
  if(vc){let t;vc.oninput=()=>{vh.value=vc.value.toUpperCase();V.preview=vc.value.toUpperCase();V.previewName="Eigen kleur";clearTimeout(t);t=setTimeout(refreshCompose,60)};vc.onchange=()=>setPrev(vc.value.toUpperCase(),"Eigen kleur");
    vh.onchange=()=>{const c=hexToRgb(vh.value);if(c)setPrev(rgbToHex(...c),"Eigen kleur")}}
  const ps=$("#psave",sh);if(ps)ps.onclick=async()=>{const pid=await newPaint({hex:V.preview,name:V.previewName&&V.previewName!=="Eigen kleur"?V.previewName:"",m2:sw.m2||""});if(pid)await assignPaint(p,v,sw.id,pid)};
  const pc=$("#pcancel",sh);if(pc)pc.onclick=()=>{V.preview=null;refreshCompose();renderSheet()};
}

/* ---------- export per kamer ---------- */
async function exportRoom(roomId){
  if(!downloads){toast("Downloaden is in deze weergave niet beschikbaar");return}
  const r=byId("rooms",roomId);
  await withBusy("Kamer-export maken…",async tt=>{
    const ph=S.photos.filter(p=>p.roomId===roomId);const panos=[];
    for(const p of ph){tt.textContent=`Foto “${p.name}” renderen…`;const img=await loadImg(assetUrl(p.assetId));await loadMasksFor(p);const pano=new Pano(img,4096);pano.setNadir(p.nadir||0);pano.setWalls(p.walls||[]);const v=activeVar(p);pano.compose(colorsFor(p,v),lsGet("smart",true));
      const c=document.createElement("canvas");c.width=Math.min(4096,pano.W);c.height=c.width/2;c.getContext("2d").drawImage(pano.canvas,0,0,c.width,c.height);
      panos.push({name:p.name,variant:v.name,src:c.toDataURL("image/jpeg",.85),walls:(p.walls||[]).filter(w=>!w.exclude).map(w=>({name:w.name,m2:w.m2,paint:byId("paints",(v.colors||{})[w.id])}))})}
    tt.textContent="Moodboard verzamelen…";const mood=[];
    for(const m of S.mood.filter(m=>m.roomId===roomId)){if(m.type==="image"){try{const img=await loadImg(assetUrl(m.assetId));const s=Math.min(1,900/img.naturalWidth);const c=document.createElement("canvas");c.width=img.naturalWidth*s;c.height=img.naturalHeight*s;c.getContext("2d").drawImage(img,0,0,c.width,c.height);mood.push({type:"image",src:c.toDataURL("image/jpeg",.8),caption:m.caption})}catch(e){}}else mood.push({...m,paint:m.paintId?byId("paints",m.paintId):null})}
    const tasks=S.tasks.filter(t=>t.roomId===roomId),items=S.items.filter(i=>i.roomId===roomId);
    const html=exportHtml(r,panos,mood,tasks,items);
    await downloads.save({filename:`${(r.name||"kamer").replace(/[^\w\- ]+/g,"")}.html`,data:html});toast("Export klaar");
  });
}
function exportHtml(r,panos,mood,tasks,items){
  const e=esc;const pr=p=>p?`<span style="display:inline-block;width:14px;height:14px;border-radius:50%;background:${e(p.hex)};vertical-align:-2px;border:1px solid #0002"></span> ${e(p.name||p.hex)} <code>${e([p.brand,p.code,p.sheen].filter(Boolean).join(" · "))}</code>`:"<i>origineel</i>";
  return `<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${e(r.name)}</title>
<style>body{font-family:system-ui,sans-serif;margin:0;padding:24px;max-width:1000px;margin:auto;color:#1c2423;background:#f4f6f4}h1{margin:0 0 4px}.pv{height:60vh;min-height:320px;border-radius:10px;overflow:hidden;background:#000;touch-action:none;cursor:grab}table{border-collapse:collapse;width:100%}td,th{padding:6px;border-bottom:1px solid #ddd;text-align:left}.mood{columns:3 200px;gap:10px}.mood>*{break-inside:avoid;margin-bottom:10px;background:#fff;border-radius:8px;overflow:hidden}.mood img{width:100%;display:block}.c{padding:8px}</style></head><body>
<h1>${e(r.name)}</h1><p>${r.style?`Stijl: <b>${e(r.style)}</b>`:""} ${e(r.notes||"")}</p>
${panos.map((p,i)=>`<h2>${e(p.name)} <small>(${e(p.variant)})</small></h2><div class="pv" id="pv${i}"></div><table><tr><th>Muur</th><th>Kleur</th><th>m²</th></tr>${p.walls.map(w=>`<tr><td>${e(w.name)}</td><td>${pr(w.paint)}</td><td>${e(w.m2||"")}</td></tr>`).join("")}</table>`).join("")}
${mood.length?`<h2>Moodboard</h2><div class="mood">${mood.map(m=>m.type==="image"?`<div><img src="${m.src}">${m.caption?`<div class="c">${e(m.caption)}</div>`:""}</div>`:m.type==="link"?`<div class="c"><a href="${e(m.href)}">${e(m.caption||m.href)}</a></div>`:m.type==="swatch"&&m.paint?`<div><div style="height:70px;background:${e(m.paint.hex)}"></div><div class="c">${pr(m.paint)}</div></div>`:`<div class="c">${e(m.text||"")}</div>`).join("")}</div>`:""}
${tasks.length?`<h2>Taken</h2><ul>${tasks.map(t=>`<li>${t.done?"✓ ":""}${e(t.title)}</li>`).join("")}</ul>`:""}
${items.length?`<h2>Bestellijst</h2><table>${items.map(i=>`<tr><td>${e(i.title)}</td><td>${e(i.status||"")}</td><td>€ ${(Number(i.qty||1)*Number(i.price||0)).toFixed(2)}</td></tr>`).join("")}</table>`:""}
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"><\/script>
<script>const P=${JSON.stringify(panos.map(p=>p.src))};P.forEach((src,i)=>{const el=document.getElementById("pv"+i);if(!window.THREE){el.innerHTML='<img src="'+src+'" style="width:100%">';return}const r=new THREE.WebGLRenderer();el.appendChild(r.domElement);const s=new THREE.Scene(),c=new THREE.PerspectiveCamera(80,1,1,1100);const g=new THREE.SphereGeometry(500,64,40);g.scale(-1,1,1);const t=new THREE.TextureLoader().load(src,()=>d());s.add(new THREE.Mesh(g,new THREE.MeshBasicMaterial({map:t})));let lon=0,lat=0,fov=80,st=null;function d(){const w=el.clientWidth,h=el.clientHeight;r.setSize(w,h);c.aspect=w/h;c.fov=fov;c.updateProjectionMatrix();const p=lon*Math.PI/180,th=(90-lat)*Math.PI/180;c.lookAt(Math.cos(p)*Math.sin(th),Math.cos(th),Math.sin(p)*Math.sin(th));r.render(s,c)}el.onpointerdown=e=>{st={x:e.clientX,y:e.clientY,lon,lat};el.setPointerCapture(e.pointerId)};el.onpointermove=e=>{if(!st)return;lon=st.lon-(e.clientX-st.x)*.1;lat=Math.max(-85,Math.min(85,st.lat+(e.clientY-st.y)*.1));d()};el.onpointerup=()=>st=null;el.onwheel=e=>{e.preventDefault();fov=Math.max(25,Math.min(100,fov+e.deltaY*.05));d()};addEventListener("resize",d);d()});<\/script></body></html>`;
}

(async()=>{
  render();
  if(!window.claude||!claude.use){$("#app").innerHTML=noDb();return}
  const [d,a,u,dl,sm]=await Promise.all([claude.use("db"),claude.use("assets"),claude.use("user"),claude.use("downloads"),claude.use("sample")]);
  db=d;assets=a;userCap=u;downloads=dl;sample=sm;canUpload=!!assets;
  try{meId=u?await u.id():null}catch(e){}
  if(!db){render();return}
  const timer=setTimeout(()=>{if(!S.loaded.tasks)toast("De gegevens zijn nog niet bereikbaar. Even geduld…",4000)},10000);
  COLS.forEach(c=>db.collection(c).onSnapshot(snap=>{S[c]=snap.docs.map(x=>({id:x.id,...x.data()}));if(!snap.metadata.fromCache){S.loaded[c]=true;if(c==="tasks")clearTimeout(timer)}render();if(V&&(c==="photos"||c==="paints"))refreshViewer()},err=>{console.error(c,err);if(err.code==="revoked"){db=null;render()}}));
})();
window.addEventListener("hashchange",()=>{if(V)closeViewer()});
